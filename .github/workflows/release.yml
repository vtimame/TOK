name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate release flow without publishing release assets"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  verify-ci:
    name: Verify CI for commit
    runs-on: ubuntu-latest

    steps:
      - name: Check CI workflow completion status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "Skipping CI verification: release is not running for a tag ref."
            exit 0
          fi

          deadline=$((SECONDS + 1800))
          while true; do
            successful_runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length')
            active_runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .status != "completed")] | length')
            failed_runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .status == "completed" and .conclusion != "success")] | length')

            if [ "$successful_runs" -gt 0 ]; then
              echo "CI check passed (${successful_runs} successful CI run(s))."
              exit 0
            fi
            if [ "$active_runs" -eq 0 ] && [ "$failed_runs" -gt 0 ]; then
              echo "CI completed without a successful run for commit ${GITHUB_SHA}."
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "CI") | {name, conclusion, status, head_sha, created_at, url}'
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for successful CI for commit ${GITHUB_SHA}."
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
                --jq '.workflow_runs[] | {name, conclusion, status, head_sha, created_at, url}'
              exit 1
            fi

            echo "Waiting for successful CI for commit ${GITHUB_SHA}..."
            sleep 30
          done

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    needs: [verify-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: tok_linux_amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - asset: tok_darwin_amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - asset: tok_darwin_arm64
            runner: macos-15
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build BINARY=dist/${{ matrix.asset }}/tok VERSION=${{ github.ref_name }}

      - name: Smoke test binary
        run: ./dist/${{ matrix.asset }}/tok version

      - name: Package binary
        run: |
          cd dist/${{ matrix.asset }}
          tar -czf ../${{ matrix.asset }}.tar.gz tok

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build, verify-ci]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tok_*
          path: dist/release
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum *.tar.gz > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign SHA256SUMS
        run: |
          set -euo pipefail
          cd dist/release
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: |
            dist/release/SHA256SUMS
            dist/release/SHA256SUMS.sigstore.json
          if-no-files-found: error

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run requested; release creation and asset upload skipped."
            exit 0
          fi

          release_flags=(--verify-tag --title "${GITHUB_REF_NAME}" --notes "TOK ${GITHUB_REF_NAME}")
          mapfile -t prerelease_flags < <(scripts/release-prerelease-flags.sh "${GITHUB_REF_NAME}")
          release_flags+=("${prerelease_flags[@]}")

          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" "${release_flags[@]}"

          for asset in dist/release/*.tar.gz; do
            gh release upload "${GITHUB_REF_NAME}" "${asset}" --clobber
          done
          gh release upload "${GITHUB_REF_NAME}" "dist/release/SHA256SUMS" --clobber
          gh release upload "${GITHUB_REF_NAME}" "dist/release/SHA256SUMS.sigstore.json" --clobber
