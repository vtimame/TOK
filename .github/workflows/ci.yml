name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Check diff whitespace
        run: git diff --check

      - name: Test
        run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run quality checks
        run: make quality

      - name: Run frontend lint
        run: pnpm lint
        working-directory: web

      - name: Run frontend tests
        run: pnpm test
        working-directory: web

      - name: Run frontend typecheck
        run: pnpm typecheck
        working-directory: web

      - name: Check OpenAPI/client drift
        run: pnpm api:check
        working-directory: web

      - name: Build
        run: pnpm build
        working-directory: web
